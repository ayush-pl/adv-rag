# Removing duplicate passages. PostgreSQL 15 and 16 share most pages, so 15% of the top 5
# passages of the best configuration repeated one ranked above them, on development and
# calibration. Each configuration is compared with and without duplicate removal.
#
# Selected on development and calibration together, then confirmed once on test:
#   uv run python scripts/run_retrieval_sweep.py --sweep configs/retrieval_improvement.yaml --split <split>
title: Duplicate removal
chunking:
  r256: {strategy: recursive, chunk_size: 256, overlap: 50}
  r512: {strategy: recursive, chunk_size: 512, overlap: 50}

embedders:
  bge: BAAI/bge-small-en-v1.5

runs:
  - {chunking: [r512], method: dense, embedder: bge}
  - {chunking: [r512], method: dense, embedder: bge, dedup: true}
  - {chunking: [r256, r512], method: hybrid, embedder: bge, rrf_k: [60]}
  - {chunking: [r256, r512], method: hybrid, embedder: bge, rrf_k: [60], dedup: true}
  - {chunking: [r256, r512], method: hybrid, embedder: bge, rrf_k: [60], rerank: true}
  - {chunking: [r256, r512], method: hybrid, embedder: bge, rrf_k: [60], rerank: true, dedup: true}

comparisons:
  - {experiment: D1, baseline: r512-dense-bge, treatment: r512-dense-bge-dedup}
  - {experiment: D1, baseline: r256-hybrid-bge-k60, treatment: r256-hybrid-bge-k60-dedup}
  - {experiment: D1, baseline: r512-hybrid-bge-k60, treatment: r512-hybrid-bge-k60-dedup}
  - {experiment: D1, baseline: r256-hybrid-bge-k60-rerank, treatment: r256-hybrid-bge-k60-dedup-rerank}
  - {experiment: D1, baseline: r512-hybrid-bge-k60-rerank, treatment: r512-hybrid-bge-k60-dedup-rerank}

top_k_configs:
  - r512-hybrid-bge-k60-rerank
  - r512-hybrid-bge-k60-dedup-rerank
