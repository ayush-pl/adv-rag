# Lint, unit tests and the regression gate. None of it needs a GPU, models, Ollama or the
# corpus: the gate runs the real retrieval and evaluation code on tests/regression/fixture.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        # No extras: PyTorch and model inference are not needed here.
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Regression gate
        # Fails on a confirmed drop. An inconclusive result passes with a warning annotation,
        # and the full report is in the job summary.
        run: uv run python scripts/regression_gate.py check
